name: Lab 03 - Exercício 02 - Docker Build

on:
  push:
    branches: [main]
    paths:
      - 'exercise-02/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./exercise-02
          push: false
          tags: webacademy:latest
      - name: Registre a execução
        run: sleep 30
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Fazendo deploy
        run: echo "Deploy com sucesso!"

